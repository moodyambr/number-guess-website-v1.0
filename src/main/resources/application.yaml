spring:
  application:
    name: number-guess

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/localdb?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # Auto-ändrar schema i dev
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true          # Visa SQL-loggar i dev

server:
  port: 8080